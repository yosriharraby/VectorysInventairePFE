name: vectorys_mobile
description: "Vectorys Inventaire — application agent (Flutter)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.3.3
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  go_router: ^14.6.2
  dartz: ^0.10.1
  mobile_scanner: ^6.0.2
  sqflite: ^2.4.1
  path: ^1.9.1
  connectivity_plus: ^6.1.3
  uuid: ^4.5.1
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/vectorys-logo.png
